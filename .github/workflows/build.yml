name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # The official image already ships switch-curl, switch-zlib and switch-mbedtls.
      - name: Build overlay
        run: make -j$(nproc)

      - name: Upload ovl-bluetooth.ovl
        uses: actions/upload-artifact@v4
        with:
          name: ovl-bluetooth
          path: ovl-bluetooth.ovl
          if-no-files-found: error
