name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do libultrahand
        run: |
          dkp-pacman -Sy --noconfirm --needed switch-curl switch-zlib switch-mbedtls
          dkp-pacman -S --noconfirm --needed switch-minizip || echo "switch-minizip indisponível (opcional)"

      - name: Compilar overlay
        run: make -j$(nproc)

      - name: Publicar ovl-bluetooth.ovl
        uses: actions/upload-artifact@v4
        with:
          name: ovl-bluetooth
          path: out/
